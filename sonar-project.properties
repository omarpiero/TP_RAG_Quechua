# Plantilla: completar organization y projectKey al crear el proyecto en SonarQube Cloud (HT-00).
sonar.organization=<organizacion-en-sonarcloud>
sonar.projectKey=<organizacion>_rag-quechua-wanka
sonar.projectName=RAG quechua wanka
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Nunca se analizan datos, documentación ni el material de referencia
sonar.exclusions=corpus/**,referencia_poc/**,docs/**,data/**,evaluacion/conjuntos/**
# En el PMV3 se añadirá app_movil/lib a sonar.sources y el informe lcov de Flutter
