[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "salvaguarda: protege la salvaguarda (abstencion, trazabilidad, forma literal, tau en configuracion)",
    "lento: usa Ollama, modelos o el indice completo",
    "datos: necesita datos fuera de Git (fragmentos, evaluacion); la CI los omite",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
